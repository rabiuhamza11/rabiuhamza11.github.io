<!DOCTYPE html>
<html>
<head>
<title>HARZ Liquidity Adder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
<pre id="output">Loading...</pre>
<script>
const OUTPUT = document.getElementById('output');
function log(msg) { OUTPUT.textContent += '\n' + msg; }
OUTPUT.textContent = 'HARZ Liquidity Adder\n===================\n';

const PRIVATE_KEY = '0x640ebe50b7c3ed187cca232c7df978486dee4bcda42885d5a9f0222d16855d9c';
const GDEG = '0x222a10CE822188c680a04A283E45F9c11D79665e';
const NRL = '0xE8423c0595E6b2caD4E6f19B6F51666699be303a';
const ROUTER = '0xa5E0829CaCEd8fFCEEd813c0150ceac53f3D19Cb';
const RPCS = [
  'https://1rpc.io/matic',
  'https://polygon-rpc.com',
  'https://polygon-bor-rpc.publicnode.com'
];

const ERC20_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function approve(address spender, uint256 amount) returns (bool)',
  'function allowance(address owner, address spender) view returns (uint256)',
  'function totalSupply() view returns (uint256)'
];

const ROUTER_ABI = [
  'function addLiquidityETH(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountETHMin, address to, uint256 deadline) payable returns (uint256, uint256, uint256)'
];

async function safeCall(contract, fn, ...args) {
  try { return await contract[fn](...args); } catch(e) { log('  (call failed: ' + e.message.substring(0,100) + ')'); return null; }
}

async function main() {
  let provider = null;
  for (const rpc of RPCS) {
    try {
      log('Trying RPC: ' + rpc);
      const p = new ethers.JsonRpcProvider(rpc);
      const blockNum = await p.getBlockNumber();
      log('Connected! Block: ' + blockNum);
      provider = p;
      break;
    } catch(e) {
      log('Failed: ' + e.message.substring(0, 80));
    }
  }
  if (!provider) { log('ERROR: No RPC available'); return; }

  const wallet = new ethers.Wallet(PRIVATE_KEY, provider);
  log('\nWallet: ' + wallet.address);
  const maticBal = await provider.getBalance(wallet.address);
  log('MATIC: ' + ethers.formatEther(maticBal));

  // GDEG - use 18 decimals (confirmed from previous session)
  const GDEG_DEC = 18;
  const gdeg = new ethers.Contract(GDEG, ERC20_ABI, wallet);
  log('\n=== GDEG ===');
  const gdegSupply = await safeCall(gdeg, 'totalSupply');
  if (gdegSupply) log('Supply: ' + ethers.formatUnits(gdegSupply, GDEG_DEC));
  const gdegBal = await safeCall(gdeg, 'balanceOf', wallet.address);
  if (gdegBal) log('Balance: ' + ethers.formatUnits(gdegBal, GDEG_DEC));
  const gdegAllow = await safeCall(gdeg, 'allowance', wallet.address, ROUTER);
  if (gdegAllow) log('Allowance: ' + ethers.formatUnits(gdegAllow, GDEG_DEC));

  // NRL - use 18 decimals
  const NRL_DEC = 18;
  const nrl = new ethers.Contract(NRL, ERC20_ABI, wallet);
  log('\n=== NRL ===');
  const nrlSupply = await safeCall(nrl, 'totalSupply');
  if (nrlSupply) log('Supply: ' + ethers.formatUnits(nrlSupply, NRL_DEC));
  const nrlBal = await safeCall(nrl, 'balanceOf', wallet.address);
  if (nrlBal) log('Balance: ' + ethers.formatUnits(nrlBal, NRL_DEC));
  const nrlAllow = await safeCall(nrl, 'allowance', wallet.address, ROUTER);
  if (nrlAllow) log('Allowance: ' + ethers.formatUnits(nrlAllow, NRL_DEC));

  // Step 1: Approve GDEG
  log('\n=== STEP 1: Approve GDEG ===');
  if (gdegAllow && gdegAllow > ethers.parseUnits('500000', GDEG_DEC)) {
    log('Already approved');
  } else {
    try {
      const amt = ethers.parseUnits('1000000', GDEG_DEC);
      log('Approving 1M GDEG...');
      const tx = await gdeg.approve(ROUTER, amt);
      log('TX: ' + tx.hash);
      const rcpt = await tx.wait();
      log('Approved! Gas: ' + rcpt.gasUsed + ' Status: ' + rcpt.status);
    } catch(e) { log('Approve failed: ' + e.message.substring(0, 300)); }
  }

  // Step 2: Add GDEG liquidity
  log('\n=== STEP 2: Add GDEG Liquidity ===');
  try {
    const router = new ethers.Contract(ROUTER, ROUTER_ABI, wallet);
    const tokenAmt = ethers.parseUnits('500000', GDEG_DEC);
    const maticAmt = ethers.parseEther('0.3');
    const deadline = Math.floor(Date.now()/1000) + 1200;
    log('Adding 500K GDEG + 0.3 MATIC...');
    const tx = await router.addLiquidityETH(GDEG, tokenAmt, tokenAmt, maticAmt, wallet.address, deadline, {value: maticAmt});
    log('TX: ' + tx.hash);
    const rcpt = await tx.wait();
    log('Done! Gas: ' + rcpt.gasUsed + ' Status: ' + rcpt.status);
  } catch(e) { log('Liquidity failed: ' + e.message.substring(0, 400)); }

  // Step 3: Approve NRL
  log('\n=== STEP 3: Approve NRL ===');
  if (nrlAllow && nrlAllow > ethers.parseUnits('500000', NRL_DEC)) {
    log('Already approved');
  } else {
    try {
      const amt = ethers.parseUnits('1000000', NRL_DEC);
      log('Approving 1M NRL...');
      const tx = await nrl.approve(ROUTER, amt);
      log('TX: ' + tx.hash);
      const rcpt = await tx.wait();
      log('Approved! Gas: ' + rcpt.gasUsed + ' Status: ' + rcpt.status);
    } catch(e) { log('Approve failed: ' + e.message.substring(0, 300)); }
  }

  // Step 4: Add NRL liquidity
  log('\n=== STEP 4: Add NRL Liquidity ===');
  try {
    const router = new ethers.Contract(ROUTER, ROUTER_ABI, wallet);
    const tokenAmt = ethers.parseUnits('500000', NRL_DEC);
    const maticAmt = ethers.parseEther('0.3');
    const deadline = Math.floor(Date.now()/1000) + 1200;
    log('Adding 500K NRL + 0.3 MATIC...');
    const tx = await router.addLiquidityETH(NRL, tokenAmt, tokenAmt, maticAmt, wallet.address, deadline, {value: maticAmt});
    log('TX: ' + tx.hash);
    const rcpt = await tx.wait();
    log('Done! Gas: ' + rcpt.gasUsed + ' Status: ' + rcpt.status);
  } catch(e) { log('Liquidity failed: ' + e.message.substring(0, 400)); }

  // Final
  log('\n=== FINAL ===');
  const finalMatic = await provider.getBalance(wallet.address);
  log('MATIC: ' + ethers.formatEther(finalMatic));
  const fGdeg = await safeCall(gdeg, 'balanceOf', wallet.address);
  if (fGdeg) log('GDEG: ' + ethers.formatUnits(fGdeg, GDEG_DEC));
  const fNrl = await safeCall(nrl, 'balanceOf', wallet.address);
  if (fNrl) log('NRL: ' + ethers.formatUnits(fNrl, NRL_DEC));
  log('\n=== COMPLETE ===');
}

main().catch(e => log('FATAL: ' + e.message));
</script>
</body>
</html>
